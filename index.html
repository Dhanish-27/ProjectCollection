<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Project | Final Year Groups</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="theme-dark">
    <!-- Background Elements for Glassmorphism -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
    <div class="bg-shape shape-3"></div>

    <nav class="navbar glass">
        <div class="nav-brand">
            <i class="ph ph-student"></i>
            <span>ProjectHub</span>
        </div>
        <div class="nav-links">
            <a href="index.html" class="nav-link active">Register</a>
            <a href="dashboard.html" class="nav-link">Dashboard</a>
            <button id="theme-toggle" class="btn-icon" aria-label="Toggle Theme">
                <i class="ph ph-sun"></i>
            </button>
        </div>
    </nav>

    <main class="container">
        <div class="form-wrapper glass-panel fade-in-up">
            <div class="form-header">
                <h1>Register Your Project</h1>
                <p>Fill in the details below to register your final year project group.</p>
            </div>
            
            <form id="registration-form" novalidate>
                <div class="form-section">
                    <h2><i class="ph ph-folder-open"></i> Project Details</h2>
                    <div class="input-group">
                        <label for="project-title">Project Title <span class="required">*</span></label>
                        <input type="text" id="project-title" name="projectTitle" placeholder="e.g., AI-Powered Attendance System" required>
                        <span class="error-msg" id="error-projectTitle"></span>
                    </div>
                    <div class="input-group">
                        <label for="group-name">Group Name <span class="required">*</span></label>
                        <input type="text" id="group-name" name="groupName" placeholder="e.g., Tech Innovators" required>
                        <span class="error-msg" id="error-groupName"></span>
                    </div>
                </div>

                <div class="form-section">
                    <div class="section-header-flex">
                        <h2><i class="ph ph-users"></i> Group Members <span class="member-count">(<span id="current-member-count">1</span>/5)</span></h2>
                        <button type="button" id="add-member-btn" class="btn btn-secondary btn-sm">
                            <i class="ph ph-plus"></i> Add Member
                        </button>
                    </div>
                    <p class="section-desc">Add at least one member and maximum up to 5 members.</p>
                    
                    <div id="members-container">
                        <!-- Members will be dynamically added here -->
                    </div>
                    <span class="error-msg" id="error-members"></span>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary btn-lg w-100">
                        <i class="ph ph-check-circle"></i> Submit Project
                    </button>
                </div>
            </form>
        </div>
    </main>

    <!-- Toast Notification Container -->
    <div id="toast-container"></div>

    <!-- Scripts -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
